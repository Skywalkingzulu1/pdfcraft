[package]
name = "pov-engine"
description = "POV engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
pov-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pov-render = { workspace = true }
pov-cos = { workspace = true }
pov-organize = { workspace = true }
pov-annot = { workspace = true }
pov-forms = { workspace = true }
pov-xfa = { workspace = true }
pov-edit = { workspace = true }
pov-audit = { workspace = true }
pov-redact = { workspace = true }
pov-print = { workspace = true }
pov-xfdf = { workspace = true }
pov-sign = { workspace = true }
pov-optimize = { workspace = true }
pov-a11y = { workspace = true }
pov-ocr = { workspace = true }
pov-js = { workspace = true }
pov-compare = { workspace = true }
pov-preflight = { workspace = true }
pov-export = { workspace = true }
pov-fonts = { workspace = true }
pov-create = { workspace = true }
pov-model = { workspace = true }
pov-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and pov-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
pov-testkit = { workspace = true }
